# Nginx configuration for Hawk Translations
# Location on VM: /etc/nginx/sites-available/hawk
#
# Port layout:
#   80  — kamal-proxy (Kamal owns this)
#   443 — kamal-proxy (Kamal owns this)
#   8443 — Nginx (Cloudflare Origin Cert SSL) → kamal-proxy on port 80
#
# Cloudflare proxies HTTPS to origin port 8443 (supported alternative port).
# Traffic flow:
#   Browser → Cloudflare (HTTPS:443) → Nginx:8443 (Origin Cert) → kamal-proxy:80 → Rails

upstream hawk_app {
  server 127.0.0.1:80;  # kamal-proxy
}

server {
  listen 8443 ssl;
  server_name hawk-translations.com www.hawk-translations.com;

  ssl_certificate     /etc/nginx/ssl/hawk-translations.com_origin_certificate.pem;
  ssl_certificate_key /etc/nginx/ssl/hawk-translations.com_private_key.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass http://hawk_app;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    client_max_body_size 50M;

    proxy_connect_timeout 60s;
    proxy_read_timeout    300s;
    proxy_send_timeout    60s;
  }
}
