# PostgreSQL. Versions 9.3 and up are supported.
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>

development:
  <<: *default
  database: hawk_development

test:
  <<: *default
  database: hawk_test

# Production connection is fully specified via DATABASE_URL / CACHE_DATABASE_URL /
# QUEUE_DATABASE_URL environment variables injected by Kamal at deploy time.
# DATABASE_URL uses the Kamal network gateway (172.18.0.1) — the 'kamal' Docker network
# gateway that routes container traffic to PostgreSQL on the VM host.
# The values below are fallbacks only — DATABASE_URL takes precedence.
#
# Connection pool size is controlled solely by max_connections (inherited from the
# default block via RAILS_MAX_THREADS). Do not set pool: here — Rails 8.1.2 raises
# an error if both pool and max_connections are present simultaneously.
# If DATABASE_URL contains pool=N, remove it — same conflict applies.
production:
  primary: &primary_production
    <<: *default
    database: hawk_production
    username: hawk
    password: <%= ENV["HAWK_DATABASE_PASSWORD"] %>
    host: 172.18.0.1
    port: 5432
  cache:
    <<: *primary_production
    database: hawk_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: hawk_production_queue
    migrations_paths: db/queue_migrate
