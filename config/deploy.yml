# Kamal deployment configuration — Hawk Translations
# Target: Oracle Cloud AMD E2 micro (x86_64, Ubuntu 22.04)
# Registry: GitHub Container Registry (ghcr.io)
#
# Architecture:
#   Cloudflare (Full strict) → kamal-proxy:443 (Cloudflare Origin Cert) → Rails container
#   kamal-proxy handles SSL with Cloudflare Origin Certificate passed via secrets.
#
# Server IP:
#   Stored in .kamal/servers (gitignored). One IP per line.
#   Create before deploying: echo "161.153.85.216" > .kamal/servers
#   Kamal reads this file at deploy time via ERB interpolation below.
#
# ARM64 migration path: change builder.arch to arm64, run kamal deploy.

service: hawk
image: ghcr.io/roasted-oolong/hawk

servers:
  web: <%= File.readlines(".kamal/servers").map(&:strip).reject(&:empty?) %>

proxy:
  host: hawk-translations.com
  app_port: 80
  ssl:
    certificate_pem: KAMAL_PROXY_TLS_CERTIFICATE_PEM
    private_key_pem: KAMAL_PROXY_TLS_PRIVATE_KEY_PEM
  healthcheck:
    path: /up
    interval: 3
    timeout: 90

registry:
  server: ghcr.io
  username: roasted-oolong
  password:
    - GITHUB_TOKEN

ssh:
  user: ubuntu
  keys:
    - ~/.ssh/oracle-forest-vm.key

env:
  secret:
    - RAILS_MASTER_KEY
    - HAWK_DATABASE_PASSWORD
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - ANTHROPIC_API_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    HAWK_PROJECT_ROOT: /rails
    WEB_CONCURRENCY: 1
    # 5 = 3 worker threads + 1 dispatcher + 1 scheduler (Solid Queue's actual total).
    # max_connections in database.yml is derived from this value and must be >= 5.
    RAILS_MAX_THREADS: 5

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bin/bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "hawk_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
